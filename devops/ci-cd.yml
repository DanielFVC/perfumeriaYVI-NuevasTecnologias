# =====================================================================
# Perfumería YVI - Pipeline CI/CD (GitHub Actions)
#
#   PLAN/CODE  -> ramas feature/* y Pull Requests hacia develop o main
#   BUILD      -> compila con Maven (Java 21)
#   TEST       -> pruebas unitarias + reporte de cobertura JaCoCo
#   RELEASE    -> publica el WAR y la imagen Docker (solo en main)
#   DEPLOY     -> despliegue al entorno "produccion" (aprobación manual)
#   OPERATE/MONITOR -> /actuator/health en el contenedor (HEALTHCHECK) y Prometheus + Grafana (docs/MONITOREO.md)
# =====================================================================
name: CI-CD Perfumeria YVI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y empaquetar
        run: mvn -B verify

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Publicar WAR
        uses: actions/upload-artifact@v4
        with:
          name: perfumeriaYVI-war
          path: target/perfumeriaYVI.war

  docker:
    name: Imagen Docker (release)
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Container Registry exige el nombre del dueño en minúsculas
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/perfumeria-yvi" >> "$GITHUB_ENV"

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}

  deploy:
    name: Despliegue a producción
    needs: docker
    runs-on: ubuntu-latest
    # El entorno "produccion" se configura en GitHub (Settings > Environments)
    # con revisores obligatorios: nadie despliega sin aprobación.
    environment: produccion
    env:
      SERVIDOR_HOST: ${{ secrets.SERVIDOR_HOST }}
    steps:
      - name: Desplegar en el servidor
        # Ejemplo con SSH: el servidor descarga la nueva imagen y reinicia el contenedor.
        # Requiere los secretos SERVIDOR_HOST, SERVIDOR_USUARIO y SERVIDOR_CLAVE_SSH.
        if: env.SERVIDOR_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USUARIO }}
          key: ${{ secrets.SERVIDOR_CLAVE_SSH }}
          script: |
            cd /opt/perfumeria-yvi
            docker compose pull app
            docker compose up -d app
            sleep 30
            docker compose exec -T app wget -qO- http://localhost:8081/actuator/health

      - name: Resumen
        run: echo "Imagen perfumeria-yvi:${{ github.sha }} lista para producción."
