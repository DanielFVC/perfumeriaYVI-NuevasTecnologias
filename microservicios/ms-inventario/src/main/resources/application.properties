# =====================================================================
# MS-01 Inventario (reabastecimiento) - Perfumería YVI
# Se ejecuta como software independiente: java -jar ms-inventario.jar
# =====================================================================
spring.application.name=ms-inventario

# Puerto propio (la app principal usa 8080; facturación usa 8092)
server.port=${PUERTO:8091}

# Solo escucha en este computador (localhost): no expone el servicio a la red
# y Windows no muestra el aviso del firewall. Para abrirlo a la red: DIRECCION=0.0.0.0
server.address=${DIRECCION:127.0.0.1}

# Respuestas JSON con tildes correctas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# OPERATE: salud e información del servicio
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.servicio.nombre=ms-inventario
info.servicio.version=1.0.0
info.servicio.descripcion=Reabastecimiento de inventario (RF06)

# Registro (logs) en consola y en archivo con rotación
logging.level.root=INFO
logging.file.name=${LOG_FILE:logs/ms-inventario.log}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
