# =====================================================
# PERFIL PROD - contenedor Docker / servidor
# Activar con: SPRING_PROFILES_ACTIVE=prod
# =====================================================
logging.level.com.mycompany.perfumeriayvi=INFO
logging.file.name=${LOG_FILE:logs/perfumeriaYVI.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=15
# RNF-S3: en producción (HTTPS) la cookie de sesión solo viaja cifrada
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
management.endpoint.health.show-details=never
# DevOps (Operar/Monitorear): health, info y prometheus en un puerto interno que no se
# publica fuera de Docker; solo Prometheus (en la red interna) y el HEALTHCHECK lo usan.
management.server.port=${MANAGEMENT_PORT:8081}
