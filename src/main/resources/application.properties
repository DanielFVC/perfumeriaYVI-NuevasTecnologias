# =====================================================
# PERFUMERIA YVI - Configuración común (todos los entornos)
# Los valores sensibles se leen de variables de entorno
# (DevOps: la misma build sirve para dev, test y prod).
# =====================================================
spring.application.name=perfumeriaYVI

# Perfil por defecto: desarrollo local
spring.profiles.default=dev

server.port=${PORT:8080}

# RNF-S3: sesión de 30 minutos, cookie HttpOnly y SameSite (cuando se ejecuta con java -jar / Docker)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# RNF-F2: páginas de error propias (error.jsp), sin trazas técnicas
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-stacktrace=never

# Vistas JSP (capa View del patrón MVVM)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# =========================
# BASE DE DATOS (MySQL)
# =========================
# RNF-S8: la aplicación se conecta con un usuario de mínimo privilegio (no root).
# Los valores reales se pasan con variables de entorno; los de aquí son los de desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/perfumeriayvi_v2?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:perfumeria_app}
spring.datasource.password=${DB_PASSWORD:PerfumeriaApp2026*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# RNF-R3: máximo 10 conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.pool-name=PerfumeriaPool

# =========================
# DEVOPS - OPERAR Y MONITOREAR (Actuator + Micrometer + Prometheus)
# =========================
# health: estado de la app y de la BD · info: versión · prometheus: métricas para Prometheus/Grafana.
# En Docker (perfil prod) estos endpoints se publican en un puerto interno (8081) que solo
# ve Prometheus; en NetBeans (perfil dev) quedan en el mismo puerto de la aplicación.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.nombre=Perfumeria YVI
info.app.arquitectura=MVVM
info.app.descripcion=Sistema de inventario y ventas
# Todas las métricas llevan la etiqueta application="perfumeriaYVI"
management.metrics.tags.application=${spring.application.name}
# RNF-R1: histograma de tiempos de respuesta para calcular el percentil 95 en Grafana
# y contar cuántas peticiones terminan en 2 s o menos (meta: 95 %).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=500ms,1s,2s

# =========================
# LOGS
# =========================
logging.level.root=INFO
logging.level.com.mycompany.perfumeriayvi=INFO
